apiVersion: v1
kind: Secret
metadata:
  name: fcg-notifications-secret
  namespace: default
type: Opaque
stringData:
  # RabbitMQ Configs
  RabbitMQ__Host: "rabbitmq"
  RabbitMQ__Username: "fcg_user"
  RabbitMQ__Password: "fcg_password"
  RabbitMQ__Queues__UserCreated: "fcg.user-created"
  RabbitMQ__Queues__PaymentProcessed: "payment.processed.sqs"

  # SQS / LocalStack Configs
  Sqs__Region: "us-east-1"
  Sqs__UrlService: "https://sqs.us-east-1.amazonaws.com"
  Sqs__AccessKeyId: "test"
  Sqs__SecretAccessKey: "test"
  Sqs__SessionToken: "test"
  Sqs__UserCreatedQueueUrl: "https://sqs.us-east-1.amazonaws.com/0000000/fcg-user-created"
  Sqs__PaymentProcessedQueueUrl: "https://sqs.us-east-1.amazonaws.com/0000000/fcg-payment-processed"
