name: Pipeline Deploy FCGNotificationWorker

on:
  push:
    branches:
      - main
    tags:
      - 'v*' 

env:
  AWS_REPOSITORY: fcg-notifications
  NAMESPACE: fcg
  DEPLOYMENT_NAME: fcg-notifications
  CONTAINER_NAME: fcg-notifications-container


jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
        AWS_REGION: ${{vars.AWS_REGION}}
        CLUSTER_NAME: ${{vars.CLUSTER_NAME}}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
            dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore FCG.NotificationsForwarder.csproj

      - name: Build
        run: dotnet build FCG.NotificationsForwarder.csproj --no-restore --configuration Release
      

      - name: Configurar Credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{vars.AWS_REGION}}
      
      - name: Login no Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Verificar se ECR existe
        run: |
          aws ecr describe-repositories --repository-names ${{ env.AWS_REPOSITORY }} --region ${{ vars.AWS_REGION }} || \
          aws ecr create-repository --repository-name ${{ env.AWS_REPOSITORY }} --region ${{ vars.AWS_REGION }}

      - name: Build, tag, e push imagem docker no ECR
        if: startsWith(github.ref, 'refs/tags/') 
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{env.AWS_REPOSITORY}}
          IMAGE_VERSION_TAG: ${{ github.ref_name }}
        run: |
          CLEAN_TAG=$(echo $IMAGE_VERSION_TAG| sed 's/^v//')
          docker build -t $REGISTRY/$REPOSITORY:$CLEAN_TAG .
          docker push $REGISTRY/$REPOSITORY:$CLEAN_TAG

      
      - name: Deploy no EKS
        if: startsWith(github.ref, 'refs/tags/')
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{env.AWS_REPOSITORY}}
          IMAGE_VERSION_TAG: ${{ github.ref_name }}
          DEPLOYMENT_NAME: ${{env.DEPLOYMENT_NAME}}
          CONTAINER_NAME: ${{env.CONTAINER_NAME}}
        run: |
          aws eks update-kubeconfig --region $AWS_REGION --name $CLUSTER_NAME
          kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic fcg-payments-secret -n ${{ env.NAMESPACE }} \
            --from-literal=RabbitMQ__Host="${{ secrets.RABBITMQ_HOST }}" \
            --from-literal=RabbitMQ__Queues__UserCreated="${{ secrets.RABBITMQ_USERCREATED_QUEUE }}" \
            --from-literal=RabbitMQ__Queues__PaymentProcessed="${{ secrets.RABBITMQ_PAYMENT_QUEUE }}" \
            --from-literal=RabbitMQ__Username="${{ secrets.RABBITMQ_USERNAME }}" \
            --from-literal=RabbitMQ__Password="${{ secrets.RABBITMQ_PASSWORD }}" \
            --from-literal=Sqs__Region="${{ secrets.SQS_REGION }}" \
            --from-literal=Sqs__UrlService="${{ secrets.SQS_URLSERVICE }}" \
            --from-literal=Sqs__AccessKeyId="${{ secrets.SQS_ACCESSKEY }}" \
            --from-literal=Sqs__SecretAcessKey="${{ secrets.SQS_SECRETACESS }}" \
            --from-literal=Sqs__SessionToken="${{ secrets.SQS_SESSIONTOKEN }}" \
            --from-literal=Sqs__UserCreatedQueueUrl="${{ secrets.SQS_USERCREATEDURL }}" \
            --from-literal=Sqs__PaymentProcessedQueueUrl="${{ secrets.SQS_PAYMENTPROCESSEDURL }}" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f ./k8s/
          kubectl set image deployment/$DEPLOYMENT_NAME $CONTAINER_NAME=$REGISTRY/$REPOSITORY:$CLEAN_TAG
          kubectl rollout status deployment/$DEPLOYMENT_NAME --timeout=120s